name: Restore original Info section
on:
  push:
    paths: ['.github/workflows/remove-shared-info-standard-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original Info
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'\s*<script\s+src=["\']https://appsandgames\.org/assets/apps-games-info-standard\.js["\']\s*></script>\s*','\n',s,flags=re.I)
              p.write_text(s,encoding='utf-8')
          p=Path('app/layout.tsx')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'^import\s+Script\s+from\s+["\']next/script["\'];?\s*\n','',s,flags=re.M)
              s=re.sub(r'\s*<Script\s+src=["\']https://appsandgames\.org/assets/apps-games-info-standard\.js["\'][^>]*/>\s*','',s,flags=re.I)
              p.write_text(s,encoding='utf-8')
          for f in ['.github/workflows/remove-shared-info-standard.yml','.github/workflows/remove-shared-info-standard-v2.yml']:
              q=Path(f)
              if q.exists(): q.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original Info section"
          git push
