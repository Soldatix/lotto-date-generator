name: One-time social preview update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/social-preview-once.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update social preview metadata
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); text=p.read_text(encoding='utf-8'); head,sep,rest=text.partition('</head>')
          if not sep: raise SystemExit('Missing </head>')
          url='https://appsandgames.org/assets/social/date-lotto-generator.jpg'
          def set_meta(h,attr,key,value):
              pat=re.compile(rf'<meta\b(?=[^>]*\b{attr}\s*=\s*["\']{re.escape(key)}["\'])[^>]*>',re.I); m=pat.search(h)
              if m:
                  tag=m.group(0); new=re.sub(r'(\bcontent\s*=\s*["\'])[^"\']*(["\'])',lambda x:x.group(1)+value+x.group(2),tag,count=1,flags=re.I); return h[:m.start()]+new+h[m.end():]
              return h+f'\n<meta {attr}="{key}" content="{value}">\n'
          for a,k,v in [('property','og:image',url),('property','og:image:width','1200'),('property','og:image:height','630'),('name','twitter:image',url)]: head=set_meta(head,a,k,v)
          if re.search(r'"image"\s*:',head): head=re.sub(r'("image"\s*:\s*")[^"]*(")',lambda m:m.group(1)+url+m.group(2),head,count=1)
          p.write_text(head+sep+rest,encoding='utf-8'); Path('.github/workflows/social-preview-once.yml').unlink(missing_ok=True)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Use Date Lotto Generator social preview image" && git push)
