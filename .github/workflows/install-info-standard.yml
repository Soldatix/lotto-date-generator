name: Install shared Apps & Games Info standard

on:
  push:
    paths:
      - '.github/workflows/install-info-standard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared Info module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          src = 'https://appsandgames.org/assets/apps-games-info-standard.js'
          if src not in s:
              tag = f'\n<script src="{src}"></script>\n'
              if re.search(r'</body\s*>', s, flags=re.I):
                  s = re.sub(r'</body\s*>', tag + '</body>', s, count=1, flags=re.I)
              else:
                  s += tag
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use shared Apps & Games Info standard"
          git push
