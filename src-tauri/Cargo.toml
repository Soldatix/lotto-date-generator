[package]
name = "date-lotto-generator"
version = "1.0.2"
description = "Date Lotto Generator Windows desktop application"
authors = ["Apps & Games"]
edition = "2021"

[lib]
name = "date_lotto_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
